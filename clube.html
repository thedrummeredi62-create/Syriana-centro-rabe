<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Clube Syriana</title>

<style>

body{
font-family: Arial, sans-serif;
background:#111;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:#1c1c1c;
padding:40px;
border-radius:12px;
width:360px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,0.6);
}

h1{
color:#d4af37;
margin-bottom:10px;
}

p{
font-size:14px;
margin-bottom:20px;
line-height:1.4;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:6px;
border:none;
font-size:14px;
}

button{
width:100%;
padding:14px;
background:#d4af37;
border:none;
border-radius:6px;
font-weight:bold;
cursor:pointer;
font-size:15px;
}

button:hover{
background:#b8962f;
}

#msg{
margin-top:15px;
color:#8aff8a;
font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<h1>Clube Syriana</h1>

<p>
Entre para o Clube Syriana e receba<br>
novidades exclusivas, convites especiais,<br>
descontos e experiências árabes únicas.
</p>

<form id="clubeForm">

<input type="text" name="nome" placeholder="Seu nome" required>

<input type="tel" name="whatsapp" placeholder="Seu WhatsApp" required>

<input type="date" name="nascimento">

<button type="submit">Entrar no Clube</button>

</form>

<p id="msg"></p>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbx6Hzct2t53TBKCOASC4B6VownbSr2Rsp-Gdss1-UkI18gdv8L9L3xFSyNjOH7LIgdy/exec";

const form = document.getElementById("clubeForm");

form.addEventListener("submit", function(e){

e.preventDefault();

const formData = new FormData(form);

fetch(scriptURL, {
method: "POST",
body: formData
})
.then(response => response.json())
.then(data => {

document.getElementById("msg").innerText =
"Cadastro realizado! Bem-vindo ao Clube Syriana.";

form.reset();

})
.catch(error => {

document.getElementById("msg").innerText =
"Erro ao enviar. Tente novamente.";

});

});

</script>

</body>
</html>
