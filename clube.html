<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clube Syriana</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topo">
    <div class="logo">SYRIANA</div>
    <nav>
        <a href="index.html">Experiência</a>
        <a href="clube.html">Clube Syriana</a>
        <a href="reserva.html">Reservas</a>
    </nav>
</header>

<section class="club-hero">
    <h1>Clube Syriana</h1>
    <p>Benefícios VIP • Presente de aniversário • Convites exclusivos</p>
</section>

<section class="club-container">

<div class="club-card" id="formBox">

<h2>Entrar para o Clube</h2>

<form id="clubForm">

<label>Nome completo</label>
<input type="text" name="nome" required>

<label>WhatsApp</label>
<input type="tel" name="whatsapp" required>

<label>Data de nascimento</label>
<input type="date" name="nascimento" required>

<button type="submit" class="btn-club">Quero fazer parte</button>

</form>
</div>

<!-- SUCESSO -->
<div class="club-success" id="sucesso">
    <div class="success-box">
        <h2>Bem-vindo ao Clube Syriana 🎉</h2>
        <p>Seu cadastro foi realizado com sucesso.</p>
        <a href="index.html" class="btn-club">Voltar ao site</a>
    </div>
</div>

</section>

<footer>© Syriana Centro Árabe</footer>

<script>
const form = document.getElementById("clubForm");

form.addEventListener("submit", function(e){
    e.preventDefault();

    const dados = new FormData(form);

    fetch("https://script.google.com/macros/s/AKfycby0q-m1OMWEQUxfu0rhzyAlxt3dMGb11ueEB_wSipRbNxI4zGWuV_dTlLNJGdh8HlnE/exec", {
        method: "POST",
        body: dados
    })
    .then(res => res.text())
    .then(() => {
        document.getElementById("formBox").style.display="none";
        document.getElementById("sucesso").style.display="flex";
    })
    .catch(() => alert("Erro ao enviar cadastro."));
});
</script>

</body>
</html>
