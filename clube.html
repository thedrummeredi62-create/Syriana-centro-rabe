<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clube Syriana</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topo">
    <div class="logo">SYRIANA</div>
    <nav>
        <a href="index.html">Experiência</a>
        <a href="clube.html">Clube Syriana</a>
        <a href="reserva.html">Reservas</a>
    </nav>
</header>

<section class="section">
    <h2>Clube Syriana</h2>
    <p style="max-width:600px;margin:auto;color:#a89263;font-family:Arial">
        Cadastre-se e receba presentes de aniversário, convites VIP e novidades exclusivas.
    </p>
</section>

<!-- FORMULÁRIO -->
<section class="form-area">

<div id="formBox">

<form id="clubForm">

    <label>Nome</label>
    <input type="text" name="nome" required>

    <label>WhatsApp</label>
    <input type="tel" name="whatsapp" required>

    <label>Data de nascimento</label>
    <input type="date" name="nascimento" required>

    <button type="submit" class="btn-gold">Entrar para o Clube</button>

</form>

</div>

<!-- MENSAGEM SUCESSO -->
<div id="sucesso" style="display:none">
    <h2>Cadastro realizado com sucesso!</h2>
    <p>Agora você faz parte do Clube Syriana 🎉</p>
    <a href="index.html" class="btn-gold">Voltar ao site</a>
</div>

</section>

<footer>
© Syriana Centro Árabe
</footer>

<script>
const form = document.getElementById("clubForm");

form.addEventListener("submit", function(e){
    e.preventDefault();

    const dados = new FormData(form);

    fetch("https://script.google.com/macros/s/AKfycby0q-m1OMWEQUxfu0rhzyAlxt3dMGb11ueEB_wSipRbNxI4zGWuV_dTlLNJGdh8HlnE/exec", {
        method: "POST",
        body: dados
    })
    .then(res => res.text())
    .then(() => {
        document.getElementById("formBox").style.display = "none";
        document.getElementById("sucesso").style.display = "block";
    })
    .catch(() => alert("Erro ao enviar. Tente novamente."));
});
</script>

</body>
</html>
