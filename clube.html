<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Clube Syriana</title>
<style>
body{
font-family: Arial, sans-serif;
background:#111;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:#1c1c1c;
padding:40px;
border-radius:10px;
width:350px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

h1{
color:#d4af37;
margin-bottom:10px;
}

p{
font-size:14px;
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:5px;
border:none;
}

button{
width:100%;
padding:12px;
background:#d4af37;
border:none;
border-radius:5px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#b8962f;
}

#msg{
margin-top:15px;
color:#8aff8a;
}
</style>
</head>

<body>

<div class="container">
<h1>Clube Syriana</h1>

<p>
Entre para o Clube Syriana e receba<br>
novidades, convites especiais,<br>
descontos e experiências exclusivas.
</p>

<form id="clubeForm">
<input type="text" id="nome" placeholder="Seu nome" required>
<input type="tel" id="whatsapp" placeholder="Seu WhatsApp" required>
<input type="date" id="nascimento">

<button type="submit">Entrar no Clube</button>
</form>

<p id="msg"></p>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbxq5ke4bdBKIBcrh-ocDh6NoaHDVmH8HmeiuQd79qdjLLICu-GPCQNi8OPxrFLJC5Bg/exec";

document.getElementById("clubeForm").addEventListener("submit", function(e){

e.preventDefault();

const data = {
nome: document.getElementById("nome").value,
whatsapp: document.getElementById("whatsapp").value,
nascimento: document.getElementById("nascimento").value
};

fetch(scriptURL,{
method:"POST",
body:JSON.stringify(data)
})
.then(res=>{
document.getElementById("msg").innerText="Cadastro realizado! Bem-vindo ao Clube Syriana.";
document.getElementById("clubeForm").reset();
})
.catch(err=>{
document.getElementById("msg").innerText="Erro ao enviar. Tente novamente.";
});

});

</script>

</body>
</html>
