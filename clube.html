<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Clube Syriana</title>

<style>
body{
font-family:Arial;
background:#111;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:#1c1c1c;
padding:40px;
border-radius:10px;
width:340px;
text-align:center;
}

h1{
color:#d4af37;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:5px;
border:none;
}

button{
width:100%;
padding:14px;
background:#d4af37;
border:none;
border-radius:5px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h1>Clube Syriana</h1>

<p>
Entre no Clube Syriana e receba convites,
novidades e benefícios exclusivos.
</p>

<form method="post"
action="https://script.google.com/macros/s/AKfycbzy-D2Uo2NG-llG4-NaFTTIGeV72pp_bVUUtX2LeWNCTT7O7OnVC6rKChj50RB1CB76/exec">

<input name="nome" type="text" placeholder="Seu nome" required>

<input name="whatsapp" type="tel" placeholder="Seu WhatsApp" required>

<input name="nascimento" type="date">

<button type="submit">Entrar no Clube</button>

</form>

</div>

</body>
</html>
