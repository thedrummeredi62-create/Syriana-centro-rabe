<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Clube Syriana</title>

<style>

body{
font-family: Arial, sans-serif;
background:#111;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:#1c1c1c;
padding:40px;
border-radius:10px;
width:350px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,0.6);
}

h1{
color:#d4af37;
margin-bottom:10px;
}

p{
font-size:14px;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:6px;
border:none;
font-size:14px;
}

button{
width:100%;
padding:14px;
background:#d4af37;
border:none;
border-radius:6px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#b8962f;
}

</style>

</head>

<body>

<div class="container">

<h1>Clube Syriana</h1>

<p>
Entre para o Clube Syriana e receba<br>
novidades, convites especiais e<br>
experiências exclusivas.
</p>

<form action="https://docs.google.com/spreadsheets/d/1uTtw9oYLfSRbgRiyAbX8EnhcfIWnZLr1aS_AO0a_lvo/edit?gid=0#gid=0" method="POST">

<input type="text" name="nome" placeholder="Seu nome" required>

<input type="tel" name="whatsapp" placeholder="Seu WhatsApp" required>

<input type="date" name="nascimento">

<button type="submit">Entrar no Clube</button>

</form>

</div>

</body>
</html>
