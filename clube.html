<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clube Syriana</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topo">
    <div class="logo">SYRIANA</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#experiencia">Experiência</a>
        <a href="reserva.html">Reservas</a>
    </nav>
</header>

<section class="clube-hero">
    <h1>Clube Syriana</h1>
    <p>Entre para o clube e receba vantagens exclusivas, presentes de aniversário e convites especiais.</p>
</section>

<section class="clube-form-section">

    <div class="clube-card">

        <h2>Cadastre-se gratuitamente</h2>

        <form id="formClube">

            <label>Nome completo</label>
            <input type="text" name="nome" required>

            <label>WhatsApp</label>
            <input type="tel" name="whatsapp" required>

            <label>Data de nascimento</label>
            <input type="date" name="aniversario" required>

            <button type="submit">Quero entrar no Clube</button>

        </form>

        <p id="msgSucesso" class="sucesso"></p>

    </div>

</section>

<footer>
    <p>Syriana Centro Árabe • Ponta Grossa</p>
</footer>


<script>
document.getElementById("formClube").addEventListener("submit", function(e){
  e.preventDefault();

  const msg = document.getElementById("msgSucesso");
  msg.innerHTML = "Enviando...";

  var formData = new FormData(this);

  fetch("https://script.google.com/macros/s/AKfycby0q-m1OMWEQUxfu0rhzyAlxt3dMGb11ueEB_wSipRbNxI4zGWuV_dTlLNJGdh8HlnE/exec", {
    method: "POST",
    body: formData
  })
  .then(response => {
      msg.innerHTML = "Cadastro realizado com sucesso! 🎉";
      document.getElementById("formClube").reset();
  })
  .catch(error => {
      msg.innerHTML = "Erro ao enviar. Tente novamente.";
  });
});
</script>

</body>
</html>
