<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservas | Syriana Restaurante Árabe</title>

<link rel="stylesheet" href="../style.css">

<style>
body{
    background:#0b0b0b;
    font-family:'Poppins', sans-serif;
    color:#fff;
    margin:0;
}

/* HEADER */
.header{
    position:fixed;
    top:0;
    width:100%;
    background:#000;
    border-bottom:1px solid #c9a227;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;
    z-index:999;
}

.logo{
    color:#c9a227;
    font-size:22px;
    font-weight:bold;
}

.menu a{
    color:#fff;
    text-decoration:none;
    margin-left:25px;
    font-weight:500;
    transition:.3s;
}

.menu a:hover{
    color:#c9a227;
}

/* FORM */
.reserva-section{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:120px 20px 80px;
}

.reserva-box{
    background:#111;
    border:1px solid #c9a227;
    border-radius:18px;
    padding:40px;
    max-width:500px;
    width:100%;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
}

.reserva-box h1{
    text-align:center;
    color:#c9a227;
}

.reserva-box p{
    text-align:center;
    margin-bottom:30px;
    color:#ccc;
}

.form-group{
    display:flex;
    flex-direction:column;
    margin-bottom:18px;
}

.form-group label{
    margin-bottom:6px;
    color:#c9a227;
}

.form-group input,
.form-group select{
    padding:14px;
    border-radius:8px;
    border:1px solid #333;
    background:#000;
    color:#fff;
}

.btn-reservar{
    width:100%;
    padding:16px;
    background:linear-gradient(45deg,#c9a227,#f3d37a);
    border:none;
    border-radius:10px;
    color:#000;
    font-weight:bold;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

.btn-reservar:hover{
    transform:scale(1.05);
}

.success-message{
    display:none;
    margin-top:20px;
    background:#8b0000;
    padding:15px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">SYRIANA</div>
    <nav class="menu">
        <a href="../index.html">Home</a>
        <a href="../clube/index.html">Clube Syriana</a>
        <a href="#">Reservas</a>
        <a href="https://wa.me/5542998340063" target="_blank">WhatsApp</a>
    </nav>
</header>

<section class="reserva-section">
<div class="reserva-box">

<h1>Reservar Mesa</h1>
<p>Garanta sua experiência árabe</p>

<form id="reservaForm">

<div class="form-group">
<label>Nome</label>
<input type="text" name="nome" required>
</div>

<div class="form-group">
<label>WhatsApp</label>
<input type="tel" name="whatsapp" required>
</div>

<div class="form-group">
<label>Data da Reserva</label>
<input type="date" name="data" required>
</div>

<div class="form-group">
<label>Horário</label>
<input type="time" name="hora" required>
</div>

<div class="form-group">
<label>Pessoas</label>
<select name="pessoas" required>
<option>1 pessoa</option>
<option>2 pessoas</option>
<option>3 pessoas</option>
<option>4 pessoas</option>
<option>5 pessoas</option>
<option>6 pessoas</option>
<option>7+</option>
</select>
</div>

<button type="submit" class="btn-reservar">Confirmar Reserva</button>

<div class="success-message" id="successMsg">
Reserva enviada com sucesso! Em breve confirmaremos pelo WhatsApp ❤️
</div>

</form>
</div>
</section>

<script>
document.getElementById("reservaForm").addEventListener("submit", function(e){
e.preventDefault();

fetch("https://script.google.com/macros/s/AKfycby0q-m1OMWEQUxfu0rhzyAlxt3dMGb11ueEB_wSipRbNxI4zGWuV_dTlLNJGdh8HlnE/exec",{
method:"POST",
body:new FormData(this)
})
.then(res=>{
document.getElementById("successMsg").style.display="block";
document.getElementById("reservaForm").reset();
})
.catch(err=>alert("Erro ao enviar reserva"));
});
</script>

</body>
</html>
