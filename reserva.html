<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservas | Syriana Restaurante Árabe</title>

<link rel="stylesheet" href="../style.css">

<style>
body{
    background:#0b0b0b;
    font-family:'Poppins', sans-serif;
    color:#fff;
}

.reserva-section{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:80px 20px;
}

.reserva-box{
    background:#111;
    border:1px solid #c9a227;
    border-radius:18px;
    padding:40px;
    max-width:500px;
    width:100%;
    box-shadow:0 0 40px rgba(0,0,0,0.6);
}

.reserva-box h1{
    text-align:center;
    color:#c9a227;
    margin-bottom:10px;
}

.reserva-box p{
    text-align:center;
    margin-bottom:30px;
    color:#ccc;
}

.form-group{
    display:flex;
    flex-direction:column;
    margin-bottom:18px;
}

.form-group label{
    margin-bottom:6px;
    color:#c9a227;
}

.form-group input,
.form-group select{
    padding:14px;
    border-radius:8px;
    border:1px solid #333;
    background:#000;
    color:#fff;
    font-size:15px;
}

.form-group input:focus,
.form-group select:focus{
    border-color:#c9a227;
    outline:none;
}

.btn-reservar{
    width:100%;
    padding:16px;
    background:linear-gradient(45deg,#c9a227,#f3d37a);
    border:none;
    border-radius:10px;
    color:#000;
    font-weight:bold;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

.btn-reservar:hover{
    transform:scale(1.05);
}

.success-message{
    display:none;
    margin-top:20px;
    background:#8b0000;
    padding:15px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
}
</style>
</head>

<body>

<section class="reserva-section">

<div class="reserva-box">

<h1>Reservar Mesa</h1>
<p>Garanta sua experiência árabe no Syriana</p>

<form id="reservaForm">

<div class="form-group">
<label>Nome</label>
<input type="text" name="nome" required>
</div>

<div class="form-group">
<label>WhatsApp</label>
<input type="tel" name="whatsapp" required>
</div>

<div class="form-group">
<label>Data da Reserva</label>
<input type="date" name="data" required>
</div>

<div class="form-group">
<label>Horário</label>
<input type="time" name="hora" required>
</div>

<div class="form-group">
<label>Pessoas</label>
<select name="pessoas" required>
<option>1 pessoa</option>
<option>2 pessoas</option>
<option>3 pessoas</option>
<option>4 pessoas</option>
<option>5 pessoas</option>
<option>6 pessoas</option>
<option>7+</option>
</select>
</div>

<button type="submit" class="btn-reservar">Confirmar Reserva</button>

<div class="success-message" id="successMsg">
Reserva enviada com sucesso! Em breve confirmaremos pelo WhatsApp ❤️
</div>

</form>
</div>
</section>

<script>
document.getElementById("reservaForm").addEventListener("submit", function(e){
e.preventDefault();

const scriptURL = "https://script.google.com/macros/s/AKfycby0q-m1OMWEQUxfu0rhzyAlxt3dMGb11ueEB_wSipRbNxI4zGWuV_dTlLNJGdh8HlnE/exec";

fetch(scriptURL,{
method:"POST",
body:new FormData(this)
})
.then(response=>{
document.getElementById("successMsg").style.display="block";
document.getElementById("reservaForm").reset();
})
.catch(error=>alert("Erro ao enviar reserva"));
});
</script>

</body>
</html>
